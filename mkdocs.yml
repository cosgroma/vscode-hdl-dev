site_name: HDL Dev
site_description: HDL development support for VS Code
site_url: https://cosgroma.github.io/vscode-hdl-dev/
repo_url: https://github.com/cosgroma/vscode-hdl-dev
repo_name: cosgroma/vscode-hdl-dev
docs_dir: docs
site_dir: site

theme:
