name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - feature/**
      - bugfix/**
      - release/**
      - hotfix/**
      - support/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Restore VS Code test binary cache
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: ${{ runner.os }}-${{ runner.arch }}-vscode-test-${{ hashFiles('package.json', 'package-lock.json', '.vscode-test.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vscode-test-

      - name: Install Linux UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Test
        timeout-minutes: 10
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a npm test
