name: Doctor GHDL Smoke

on:
  workflow_dispatch:
    inputs:
      gencor_repository:
        description: GitHub repository containing the GEnCor tree.
        required: true
        default: cosgroma/sergeant
      gencor_ref:
        description: Git ref to check out from the GEnCor repository.
        required: true
        default: main
      gencor_path:
        description: Path to engines/gencor inside the checked-out GEnCor repository.
        required: true
        default: sergeant/engines/gencor
      ghdl_tag:
        description: GHDL release tag to install/cache.
        required: true
        default: v6.0.0
      gnat_tag:
        description: GNAT-FSF release tag for source-mode bootstrap.
        required: true
        default: gnat-14.2.0-1
      bootstrap_mode:
        description: GHDL bootstrap mode.
        required: true
        default: binary
        type: choice
        options:
          - binary
          - auto
          - source

permissions:
  contents: read

jobs:
  doctor-ghdl:
    name: Cached GHDL Doctor Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GHDL_BASE: ${{ github.workspace }}/.cache/gencor-ghdl
      GHDL_TOOLCHAIN_ROOT: ${{ github.workspace }}/.cache/gencor-ghdl/installs/${{ inputs.ghdl_tag }}

    steps:
      - name: Check out extension
        uses: actions/checkout@v5

      - name: Check out GEnCor source
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.gencor_repository }}
          ref: ${{ inputs.gencor_ref }}
          path: sergeant

      - name: Compute dependency script hash
        id: deps-hash
        working-directory: ${{ github.workspace }}/${{ inputs.gencor_path }}
        run: |
          {
            find scripts -maxdepth 1 -type f -name 'deps.sh' -print
            find scripts/lib/deps -type f -name '*.sh' -print
          } | sort | xargs sha256sum | sha256sum | awk '{print "hash="$1}' >> "$GITHUB_OUTPUT"

      - name: Restore GHDL cache
        id: cache-ghdl
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GHDL_BASE }}
            ${{ github.workspace }}/${{ inputs.gencor_path }}/.cache/ghdl-tools
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-ghdl-${{ inputs.ghdl_tag }}-${{ inputs.gnat_tag }}-${{ inputs.bootstrap_mode }}-${{ steps.deps-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ghdl-${{ inputs.ghdl_tag }}-${{ inputs.gnat_tag }}-${{ inputs.bootstrap_mode }}-
            ${{ runner.os }}-${{ runner.arch }}-ghdl-${{ inputs.ghdl_tag }}-

      - name: Bootstrap cached GHDL toolchain
        if: steps.cache-ghdl.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/${{ inputs.gencor_path }}
        run: |
          ./scripts/deps.sh bootstrap ghdl-local \
            --base-dir "$GHDL_BASE" \
            --tag "${{ inputs.ghdl_tag }}" \
            --gnat-tag "${{ inputs.gnat_tag }}" \
            --mode "${{ inputs.bootstrap_mode }}"

      - name: Ensure ghwdump and dependency metadata
        working-directory: ${{ github.workspace }}/${{ inputs.gencor_path }}
        run: |
          GHDL_TOOLCHAIN_ROOT="$GHDL_TOOLCHAIN_ROOT" \
            ./scripts/deps.sh install ghdl --yes

      - name: Publish toolchain environment
        run: |
          echo "$GHDL_TOOLCHAIN_ROOT/bin" >> "$GITHUB_PATH"
          echo "GHDL_TOOLCHAIN_ROOT=$GHDL_TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

      - name: Check Doctor inputs
        working-directory: ${{ github.workspace }}/${{ inputs.gencor_path }}
        run: |
          ./scripts/deps.sh check ghdl
          ghdl --version
          ghwdump -h | grep -E '^[[:space:]]*-H[[:space:]]'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install extension dependencies
        run: npm ci

      - name: Run extension tests with cached GHDL available
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          npm test
