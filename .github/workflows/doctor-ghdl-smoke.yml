name: Doctor GHDL Smoke

on:
  workflow_dispatch:
    inputs:
      ghdl_tag:
        description: GHDL release tag to install/cache.
        required: true
        default: v6.0.0
      bootstrap_mode:
        description: GHDL bootstrap mode.
        required: true
        default: binary
        type: choice
        options:
          - binary
          - auto

permissions:
  contents: read

jobs:
  doctor-ghdl:
    name: Cached GHDL Doctor Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HDL_DEV_GHDL_TAG: ${{ inputs.ghdl_tag }}
      HDL_DEV_GHDL_BASE: ${{ github.workspace }}/.cache/hdl-dev-ghdl
      HDL_DEV_GHDL_BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
      GHDL_TOOLCHAIN_ROOT: ${{ github.workspace }}/.cache/hdl-dev-ghdl/installs/${{ inputs.ghdl_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore GHDL cache
        id: cache-ghdl
        uses: actions/cache@v5
        with:
          path: .cache/hdl-dev-ghdl
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-ghdl-${{ inputs.ghdl_tag }}-${{ inputs.bootstrap_mode }}-${{ hashFiles('Makefile', 'scripts/deps.sh', 'scripts/lib/deps/**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ghdl-${{ inputs.ghdl_tag }}-${{ inputs.bootstrap_mode }}-
            ${{ runner.os }}-${{ runner.arch }}-ghdl-${{ inputs.ghdl_tag }}-

      - name: Ensure cached GHDL toolchain
        run: make deps-install-ghdl

      - name: Publish toolchain environment
        run: |
          echo "$GHDL_TOOLCHAIN_ROOT/bin" >> "$GITHUB_PATH"
          echo "GHDL_TOOLCHAIN_ROOT=$GHDL_TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

      - name: Check Doctor inputs
        run: |
          make deps-check-ghdl
          ghdl --version
          ghwdump -h | grep -E '^[[:space:]]*-H[[:space:]]'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install extension dependencies
        run: npm ci

      - name: Restore VS Code test binary cache
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: ${{ runner.os }}-${{ runner.arch }}-vscode-test-${{ hashFiles('package.json', 'package-lock.json', '.vscode-test.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vscode-test-

      - name: Install Linux UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run extension tests with cached GHDL available
        timeout-minutes: 10
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a npm test
