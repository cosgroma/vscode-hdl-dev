name: Git Flow Policy

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request branch direction
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "$BASE_REF" in
            main)
              case "$HEAD_REF" in
                release/*|hotfix/*)
                  ;;
                *)
                  echo "::error::Git Flow only allows release/* and hotfix/* branches to target main. Open feature and bugfix work against develop."
                  exit 1
                  ;;
              esac
              ;;
            develop)
              case "$HEAD_REF" in
                feature/*|bugfix/*|release/*|hotfix/*|support/*)
                  ;;
                *)
                  echo "::error::Git Flow pull requests into develop must come from feature/*, bugfix/*, release/*, hotfix/*, or support/* branches."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Unsupported Git Flow base branch: $BASE_REF"
              exit 1
              ;;
          esac

          echo "Git Flow branch direction accepted: $HEAD_REF -> $BASE_REF"
